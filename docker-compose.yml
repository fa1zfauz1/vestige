# ═══════════════════════════════════════════════
# Family Digital Archive - Docker Compose
# ═══════════════════════════════════════════════
# Phase 1: Foundation MVP (Active)
#   nginx, backend, frontend, postgres, redis, minio
# Phase 3: AI Service (Placeholder)
#   ai-service
# Phase 4: OCR Service (Placeholder)
#   ocr-service

services:
  # ─── Phase 1: Foundation MVP ───────────────────

  nginx:
    image: nginx:alpine
    container_name: ${COMPOSE_PROJECT_NAME}-nginx
    ports:
      - "${APP_PORT:-80}:80"
      - "${APP_HTTPS_PORT:-443}:443"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - backend
      - frontend
    networks:
      - archive-network
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME}-backend
    environment:
      - APP_ENV=${APP_ENV:-local}
      - APP_DEBUG=${APP_DEBUG:-true}
      - APP_KEY=${APP_KEY}
      - APP_URL=${APP_URL:-http://localhost}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost}
      - DB_CONNECTION=pgsql
      - DB_HOST=${POSTGRES_HOST:-postgres}
      - DB_PORT=${POSTGRES_PORT:-5432}
      - DB_DATABASE=${POSTGRES_DB:-family_archive}
      - DB_USERNAME=${POSTGRES_USER:-archive_user}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-secret}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-devredispassword}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - FILESYSTEM_DISK=minio
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin}
      - MINIO_BUCKET=${MINIO_BUCKET:-photos}
      - MINIO_REGION=${MINIO_REGION:-us-east-1}
      - MINIO_ENDPOINT=${MINIO_URL:-http://minio:9000}
      - MINIO_PUBLIC_URL=${MINIO_PUBLIC_URL:-http://localhost:9000}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-http://localhost/api/auth/google/callback}
      - APP_ADMIN_EMAIL=${APP_ADMIN_EMAIL}
    volumes:
      - ./apps/backend:/var/www/html
      - backend-storage:/var/www/html/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - archive-network
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME}-frontend
    environment:
      - NUXT_PUBLIC_API_BASE=http://localhost/api
      - NUXT_HOST=0.0.0.0
      - NUXT_PORT=3000
    volumes:
      - ./apps/frontend:/app
      - frontend-node-modules:/app/node_modules
    networks:
      - archive-network
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: ${COMPOSE_PROJECT_NAME}-postgres
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-family_archive}
      - POSTGRES_USER=${POSTGRES_USER:-archive_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-secret}
    ports:
      - "${POSTGRES_PORT_EXTERNAL:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - archive-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-archive_user} -d ${POSTGRES_DB:-family_archive}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: ${COMPOSE_PROJECT_NAME}-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-}
    ports:
      - "${REDIS_PORT_EXTERNAL:-6379}:6379"
    volumes:
      - redis-data:/data
    networks:
      - archive-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # NOTE: MinIO's upstream community images were removed from Docker Hub
  # (`minio/minio` now 404s) and Quay (`quay.io/minio/*` is private) in 2025.
  # The upstream project is archived and source-only. We therefore use the
  # community mirror maintained by Coolify, pinned to a dated release.
  # Digest: sha256:69b55a1c1c5dc285ce04db96689f5b2102317fc77a50680a1874ca6efd1c87f9
  # See README → "Object storage (MinIO)" for alternatives / how to bump this.
  minio:
    image: ghcr.io/coollabsio/minio:2025-10-15T17-29-55Z
    container_name: ${COMPOSE_PROJECT_NAME}-minio
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_API_PORT_EXTERNAL:-9000}:9000"
      - "${MINIO_CONSOLE_PORT_EXTERNAL:-9001}:9001"
    volumes:
      - minio-data:/data
    networks:
      - archive-network
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ─── Phase 3: AI Service (Placeholder) ────────

  ai-service:
    image: python:3.12-slim
    container_name: ${COMPOSE_PROJECT_NAME}-ai-service
    working_dir: /app
    volumes:
      - ./apps/ai-service:/app
    command: >
      sh -c "pip install -r requirements.txt 2>/dev/null; uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload"
    ports:
      - "${AI_SERVICE_PORT:-8001}:8001"
    profiles:
      - ai
      - all
    networks:
      - archive-network
    restart: unless-stopped

  # ─── Phase 4: OCR Service (Placeholder) ───────

  ocr-service:
    image: python:3.12-slim
    container_name: ${COMPOSE_PROJECT_NAME}-ocr-service
    working_dir: /app
    volumes:
      - ./apps/ocr-service:/app
    command: >
      sh -c "pip install -r requirements.txt 2>/dev/null; echo 'OCR Service - Phase 4 placeholder. Run with profile.'"
    profiles:
      - ocr
      - all
    networks:
      - archive-network
    restart: unless-stopped

  # ─── Phase 3+4: MinIO Bucket Setup ────────────

  minio-setup:
    # `minio/mc` was removed alongside the server image; Bitnami's frozen
    # legacy client image ships the same `mc` binary at /opt/bitnami/minio-client/bin.
    image: bitnamilegacy/minio-client:latest
    container_name: ${COMPOSE_PROJECT_NAME}-minio-setup
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin};
      mc mb local/${MINIO_BUCKET:-photos} --ignore-existing;
      mc anonymous set download local/${MINIO_BUCKET:-photos};
      echo 'MinIO bucket ready: ${MINIO_BUCKET:-photos}';
      "
    profiles:
      - setup
    networks:
      - archive-network

networks:
  archive-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  minio-data:
  backend-storage:
  frontend-node-modules:
